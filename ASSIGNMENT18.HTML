<!DOCTYPE html>
<html>
<head>
    <title>ABC College Admission</title>
</head>
<body>

<center>

<h1 style="background-color:navy; color:white; padding:15px;">
ABC College Admission 2026
</h1>

<h2>Courses and Fees</h2>

<table border="1" cellpadding="8">
    <caption>Available Courses</caption>
    <tr>
        <th>Course</th>
        <th>Seats</th>
        <th>Fees</th>
    </tr>
    <tr>
        <td>B.Tech CSE</td>
        <td>120</td>
        <td>₹90,000</td>
    </tr>
    <tr>
        <td>BCA</td>
        <td>60</td>
        <td>₹45,000</td>
    </tr>
</table>

<br>

<fieldset style="width:390px; text-align:left;">
    <legend>Application Form</legend>

    Name:<br>
    <input type="text" size="30" required>
    <br><br>

    Email:<br>
    <input type="email" size="30" required>
    <br><br>

    Course:<br>
    <select>
        <option>B.Tech CSE</option>
        <option>BCA</option>
    </select>
    <br><br>

    Statement:<br>
    <textarea rows="3" cols="40"></textarea>
    <br><br>

    <button type="submit">Apply</button>
</fieldset>

<h4 style="background-color:navy; color:white; padding:8px;">
© 2026 ABC College
</h4>

</center>

</body>
</html>
